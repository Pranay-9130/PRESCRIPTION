<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - RxVault</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="brand-logo">
                <div class="brand-icon"><i class="ri-heart-pulse-fill"></i></div>
                <span>RxVault</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link"><i class="ri-home-4-fill"></i> Home</a></li>
                <li><a href="/kiosk" class="nav-link"><i class="ri-computer-fill"></i> Prescription Kiosk</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-wrapper">
        <div class="page-container" style="max-width: 500px;">
            <div class="page-header">
                <div class="page-header-icon icon-secure"><i class="ri-id-card-fill"></i></div>
                <h1>Hospital Staff Login</h1>
                <p>Reception, help desk, hospital admin, and system admin access.</p>
            </div>
            {% if error %}
            <div class="alert-message alert-danger"><i class="ri-error-warning-fill"></i> {{ error }}</div>
            {% endif %}
            <form class="form-card" method="POST" action="/staff/login">
                <div class="form-group">
                    <label for="username"><i class="ri-user-fill"></i> Staff Username</label>
                    <input id="username" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="ri-lock-password-fill"></i> Password</label>
                    <input id="password" name="password" type="password" class="form-control" required>
                </div>
                <button class="btn btn-block" type="submit"><i class="ri-login-circle-fill"></i> Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
