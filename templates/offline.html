<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - RxVault</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="page-container" style="max-width: 640px; text-align: center;">
            <div class="success-card">
                <div class="page-header-icon" style="background: linear-gradient(145deg, #fb7185, #ef4444);"><i class="ri-wifi-off-fill"></i></div>
                <h1>You are currently offline</h1>
                <p class="muted">RxVault can still show previously saved appointments and prescriptions on this device.</p>
                <p>Reconnect to the internet to book new appointments or sync doctor records.</p>
                <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem;">
                    <a class="btn" href="/"><i class="ri-home-4-fill"></i> Try Home</a>
                    <a class="btn btn-outline" href="/my-prescription"><i class="ri-file-text-fill"></i> My Prescription</a>
                    <a class="btn btn-secondary" href="/doctor"><i class="ri-stethoscope-line"></i> Doctor Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
